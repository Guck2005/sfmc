# Template secret — real values must be injected via CI/CD
# (Vault, AWS Secrets Manager, GitHub Actions secrets, sealed-secrets).
# Do NOT commit real base64-encoded secrets to git.
apiVersion: v1
kind: Secret
metadata:
  name: sfmc-secrets
  namespace: sfmc
type: Opaque
data:
  # echo -n "<value>" | base64
  JWT_SECRET: ""
  DB_PASSWORD: ""
  APP_KEY: ""
