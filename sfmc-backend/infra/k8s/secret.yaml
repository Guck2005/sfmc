# -----------------------------------------------------------------------------
# SFMC secrets — TEMPLATE with placeholders
# -----------------------------------------------------------------------------
# Do NOT commit real values here. Placeholders of the form ${VAR} are replaced
# at deploy time by `infra/k8s/apply-secrets.sh`, which reads values from the
# ambient environment (typically injected by GitHub Actions secrets).
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: sfmc-secrets
  namespace: sfmc
type: Opaque
stringData:
  JWT_SECRET: "${JWT_SECRET}"
  DB_PASSWORD: "${DB_PASSWORD}"
  APP_KEY: "${APP_KEY}"
