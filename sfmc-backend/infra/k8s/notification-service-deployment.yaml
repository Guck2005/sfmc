---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: sfmc
  labels: { app: notification-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      containers:
        - name: notification-service
          image: sfmc/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3008
          env:
            - { name: PORT, value: "3008" }
            - { name: DB_HOST, value: "notification-db" }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_DATABASE, value: "sfmc_notification" }
          envFrom:
            - configMapRef: { name: sfmc-config }
            - secretRef: { name: sfmc-secrets }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /health, port: 3008 }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: 3008 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: sfmc
spec:
  type: ClusterIP
  selector: { app: notification-service }
  ports:
    - port: 3008
      targetPort: 3008
      protocol: TCP
