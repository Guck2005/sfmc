---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sfmc
  labels: { app: prometheus }
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: sfmc-services
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [sfmc] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: (auth|user|product|inventory|order|production|billing|notification|reporting)-service
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
      - job_name: rabbitmq
        static_configs:
          - targets: ["rabbitmq:15692"]
      - job_name: redis
        static_configs:
          - targets: ["redis:9121"]

  alerts.yml: |
    groups:
      - name: sfmc.availability
        rules:
          - alert: ServiceDown
            expr: up{job="sfmc-services"} == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "Service {{ $labels.app }} is down"
              description: "Pod {{ $labels.pod }} has been unhealthy for 2m."

      - name: sfmc.latency
        rules:
          - alert: HighLatencyP95
            expr: histogram_quantile(0.95, sum by (le, app) (rate(http_request_duration_seconds_bucket[5m]))) > 2
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "High p95 latency on {{ $labels.app }}"
              description: "p95 > 2s for 5 minutes."

      - name: sfmc.rabbitmq
        rules:
          - alert: DLQNotEmpty
            expr: rabbitmq_queue_messages_ready{queue="sfmc.dlq"} > 0
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "Messages stuck in sfmc.dlq"
              description: "{{ $value }} messages have been sitting in the dead-letter queue for 5 minutes. Manual inspection required."

          - alert: QueueSaturation
            expr: sum by (queue) (rabbitmq_queue_messages_ready) > 1000
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "Queue backlog on {{ $labels.queue }}"
              description: "> 1000 messages ready to consume for 10 minutes."
